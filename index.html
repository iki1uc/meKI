<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · System‑Zentrale</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    padding:0;
  }

  header {
    text-align:center;
    padding:25px 0;
    font-size:34px;
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
    border-bottom:1px solid #0a1a2a;
  }

  #layout {
    display:flex;
    height:calc(100vh - 100px);
  }

  #left {
    width:30%;
    border-right:1px solid #0a1a2a;
    padding:20px;
    overflow-y:auto;
  }

  #right {
    width:70%;
    padding:20px;
    overflow-y:auto;
  }

  h2 {
    color:#00eaff;
    margin-top:20px;
    margin-bottom:10px;
  }

  .module {
    border:1px solid #0a1a2a;
    padding:12px;
    margin-bottom:12px;
    background:#0b1220;
    border-radius:6px;
  }

  #run {
    margin-top:20px;
    padding:12px 20px;
    background:#00eaff;
    color:#000;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
  }

  #output {
    margin-top:20px;
    padding:15px;
    background:#0b1220;
    border:1px solid #0a1a2a;
    border-radius:6px;
    min-height:200px;
    white-space:pre-wrap;
  }
</style>
</head>

<body>

<header>meKI · System‑Zentrale</header>

<div id="layout">

  <!-- LEFT SIDE: MODULE LIST -->
  <div id="left">
    <h2>Module</h2>

    <div class="module">RUN</div>
    <div class="module">combo.js</div>
    <div class="module">eco-shift.js</div>
    <div class="module">game.js</div>
    <div class="module">gates.js</div>
    <div class="module">mia-core.js</div>
    <div class="module">mia-tribunal.js</div>
    <div class="module">realitypulse.js</div>
    <div class="module">score.js</div>
    <div class="module">tech.js</div>
    <div class="module">tribunal.js</div>
    <div class="module">wloch.js</div>
    <div class="module">SET.js</div>
    <div class="module">SETI.js</div>
    <div class="module">SETI‑Reality.js</div>
    <div class="module">SET‑Pulse.js</div>
    <div class="module">cube.js</div>
    <div class="module">meKI.js</div>
    <div class="module">team-kernel.js</div>
    <div class="module">visualizer.js</div>

    <button id="run">System starten</button>
  </div>

  <!-- RIGHT SIDE: OUTPUT -->
  <div id="right">
    <h2>System‑Output</h2>
    <div id="output">Bereit…</div>
  </div>

</div>

<script type="module">

import { meKI } from "./meKI.js";
import { TeamKernel } from "./team-kernel.js";
import { visualize2268 } from "./visualizer.js";
import { SET } from "./SET.js";
import { SETI } from "./SETI.js";
import { Pulse } from "./SET-Pulse.js";
import { Reality } from "./SETI-Reality.js";
import { scoreSystem } from "./score.js";
import { gates } from "./gates.js";
import { game } from "./game.js";
import { ecoShift } from "./eco-shift.js";
import { combo } from "./combo.js";
import { cube } from "./cube.js";
import { realityPulse } from "./realitypulse.js";
import { tech } from "./tech.js";
import { tribunal } from "./tribunal.js";
import { miaCore } from "./mia-core.js";
import { miaTribunal } from "./mia-tribunal.js";
import { wloch } from "./wloch.js";

document.getElementById("run").onclick = () => {

  const system = {
    meKI: meKI(),
    team: TeamKernel(),
    cube: cube(),
    gates: gates(),
    game: game(),
    score: scoreSystem(),
    eco: ecoShift(),
    combo: combo(),
    pulse: Pulse(),
    reality: Reality(),
    realityPulse: realityPulse(),
    tech: tech(),
    tribunal: tribunal(),
    miaCore: miaCore(),
    miaTribunal: miaTribunal(),
    wloch: wloch()
  };

  visualize2268(system);

  document.getElementById("output").textContent =
    JSON.stringify(system, null, 2);
};

</script>

</body>
</html>
