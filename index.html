<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · Continuum‑Clock · Sonne · Mond · Erde</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    padding:0;
    overflow:hidden;
  }

  /* CLOCK FIELD */
  #clock {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:radial-gradient(circle at center, #0b1220, #000);
    transition:all .6s ease;
  }

  /* ZAHNRÄDER */
  .gear {
    width:140px;
    height:140px;
    border:6px solid #7dd3fc;
    border-radius:50%;
    margin:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    transition:transform 1s linear;
  }

  /* PANEL */
  #panel {
    position:fixed;
    bottom:0;
    left:0; right:0;
    background:#000;
    border-top:2px solid #7dd3fc;
    padding:20px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }
  .btn:hover {
    background:#12263a;
    transform:scale(1.05);
  }
</style>
</head>

<body>

<div id="clock">
  <div id="sun" class="gear">☀</div>
  <div id="moon" class="gear">☾</div>
  <div id="earth" class="gear">⊕</div>

  <pre id="info"></pre>
</div>

<div id="panel">
  <button class="btn" onclick="rotateSun()">Sonne drehen</button>
  <button class="btn" onclick="rotateMoon()">Mond drehen</button>
  <button class="btn" onclick="rotateEarth()">Erde drehen</button>
  <button class="btn" onclick="axiom()">Axiom‑Check</button>
  <button class="btn" onclick="resetClock()">Reset</button>
</div>

<script>
/* ZAHNRAD‑ROTATION */
function rotateSun(){
  const s = document.getElementById("sun");
  s.style.transform = "rotate(" + (Math.random()*360) + "deg)";
}

function rotateMoon(){
  const m = document.getElementById("moon");
  m.style.transform = "rotate(" + (Math.random()*360) + "deg)";
}

function rotateEarth(){
  const e = document.getElementById("earth");
  e.style.transform = "rotate(" + (Math.random()*360) + "deg)";
}

/* RESET */
function resetClock(){
  document.getElementById("sun").style.transform = "rotate(0deg)";
  document.getElementById("moon").style.transform = "rotate(0deg)";
  document.getElementById("earth").style.transform = "rotate(0deg)";
  document.getElementById("info").textContent = "";
}

/* AXIOM‑CHECK (Himmelsrichtung + Sonne + Mond + Erde) */
function axiom(){
  const info = document.getElementById("info");

  const sunDeg = Math.floor(Math.random()*360);
  const moonDeg = Math.floor(Math.random()*360);
  const earthDeg = Math.floor(Math.random()*360);

  let axiom = "H";

  if(sunDeg < 120) axiom = "H";       // Osten
  else if(sunDeg < 240) axiom = "B";  // Süden
  else axiom = "T";                   // Westen

  info.textContent =
    "Sonne: " + sunDeg + "°\n" +
    "Mond: " + moonDeg + "°\n" +
    "Erde: " + earthDeg + "°\n\n" +
    "Aktives Axiom: " + axiom;
}
</script>

</body>
</html>
