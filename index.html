<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>iki · Raumkrümmung · Continuum</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:system-ui;
    margin:0;
    padding:0;
  }

  #continuum {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at center, #0b1220, #000);
    transition:all .6s ease;
  }

  #continuum.krumm {
    transform:perspective(600px) rotateX(var(--krummX)) rotateY(var(--krummY));
    filter:blur(var(--blur));
  }

  #controls {
    position:fixed;
    bottom:0;
    left:0; right:0;
    background:#000;
    border-top:2px solid #7dd3fc;
    padding:20px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }
  .btn:hover {
    background:#12263a;
    transform:scale(1.05);
  }
</style>
</head>

<body>

<div id="continuum">
  <h1>Continuum‑Raumkrümmung aktiv</h1>
</div>

<div id="controls">
  <button class="btn" onclick="krumm(-20,0, '2px')">H‑Achse · Krümmung</button>
  <button class="btn" onclick="krumm(0,-20, '3px')">B‑Achse · Krümmung</button>
  <button class="btn" onclick="krumm(20,20, '4px')">T‑Achse · Krümmung</button>

  <button class="btn" onclick="zeit('V')">Vergangenheit</button>
  <button class="btn" onclick="zeit('J')">Jetzt</button>
  <button class="btn" onclick="zeit('Z')">Zukunft</button>

  <button class="btn" onclick="resetKrumm()">Reset</button>
</div>

<script>
function krumm(x, y, blur){
  const c = document.getElementById("continuum");
  c.classList.add("krumm");
  c.style.setProperty("--krummX", x+"deg");
  c.style.setProperty("--krummY", y+"deg");
  c.style.setProperty("--blur", blur);
}

function resetKrumm(){
  const c = document.getElementById("continuum");
  c.classList.remove("krumm");
}

function zeit(axis){
  const c = document.getElementById("continuum");
  if(axis === "V") c.style.background = "radial-gradient(circle, #220000, #000)";
  if(axis === "J") c.style.background = "radial-gradient(circle, #002222, #000)";
  if(axis === "Z") c.style.background = "radial-gradient(circle, #000022, #000)";
}
</script>

</body>
</html>
