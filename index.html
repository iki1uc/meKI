<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:20px;
    padding:10px;
    z-index:99999;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  #axis-panel {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:#000;
    border-top:2px solid #7dd3fc;
    z-index:99999;
  }

  #super-panel {
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:99999;
  }

  #jackpot-slot {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ffaa00;
    font-size:26px;
    z-index:99999;
  }

  button {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>
<div id="axis-panel"></div>
<div id="super-panel"></div>
<div id="jackpot-slot">Jackpot: —</div>

<div id="grid"></div>

const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",

  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",

<!-- FINAL‑MODULE: GA/meKI/MIE · 756 · 2268 · ALLXALL · OUTRO -->
<script>
/* FINAL‑SCREEN */
const FS = document.createElement("div");
FS.id = "final-screen";
FS.style.cssText = `
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:#000; color:#7dd3fc; font-family:monospace;
  display:none; justify-content:center; align-items:center;
  flex-direction:column; text-align:center; z-index:999999;
  padding:20px; font-size:22px;
`;
document.body.appendChild(FS);

/* SHOW FINAL */
function FINAL(title, text){
  FS.innerHTML = `
    <div style="font-size:40px; margin-bottom:20px;">${title}</div>
    <div style="margin-bottom:40px;">${text}</div>
    <div id="cube" style="width:120px; height:120px; border:3px solid #7dd3fc;"></div>
  `;
  FS.style.display = "flex";
  CUBE_ANIM();
}

/* 3D‑Zauberwürfel‑Animation */
function CUBE_ANIM(){
  let deg = 0;
  const cube = document.getElementById("cube");
  setInterval(()=>{
    deg += 3;
    cube.style.transform = `rotateY(${deg}deg) rotateX(${deg/2}deg)`;
  }, 30);
}

/* OUTRO MIT 9 BUCHSTABEN */
function OUTRO(){
  FINAL("MEKIMAGIC", "Danke fürs Spielen · Das Kontinuum schließt sich.");
}

/* FINALE TRIGGER — 13 Sekunden */
setTimeout(()=>{

  const r = Math.floor(Math.random()*5);

  if(r === 0) FINAL("GA · meKI · MIE", "Axiomisches Dreieck abgeschlossen.");
  if(r === 1) FINAL("756‑Achsen‑Finale", "Magic‑Grid vollständig durchlaufen.");
  if(r === 2) FINAL("2268‑Würfel‑Finale", "ALLXALL‑Kontinuum stabilisiert.");
  if(r === 3) FINAL("ALLXALL · 360°", "Orbit abgeschlossen · System stabil.");
  if(r === 4) OUTRO();

}, 13000);
</script>

</html>
