<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  /* SCORE */
  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:20px;
    padding:10px;
    z-index:99999;
  }

  /* GRID 756 */
  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  .cell:hover {
    background:#12263a;
    transform:scale(1.08);
  }

  /* DRAG BUTTONS */
  .drag-btn {
    position:absolute;
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px;
    font-size:14px;
    cursor:pointer;
    border-radius:6px;
    transition:.15s;
    z-index:99999;
    user-select:none;
  }
  .drag-btn:active {
    transform:scale(1.1);
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>

<!-- DRAGGABLE BUTTONS -->
<button id="btn1" class="drag-btn" style="top:10px; left:10px;">Drehen</button>
<button id="btn2" class="drag-btn" style="top:10px; right:10px;">Axiome</button>
<button id="btn3" class="drag-btn" style="bottom:10px; left:50%; transform:translateX(-50%);">Reset</button>

<!-- GRID -->
<div id="grid"></div>

<script>
/* 756 NC‑Magic Symbole */
const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
  "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
  "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
];

/* SCORE */
let score = 0;
function updateScore(){
  score++;
  document.getElementById("score").textContent = "Score: " + score;
}

/* GRID ERZEUGEN */
const grid = document.getElementById("grid");
const cells = [];

for(let i=0;i<756;i++){
  const cell = document.createElement("div");
  cell.className = "cell";

  /* Symbol */
  cell.textContent = symbols[i % symbols.length];

  /* Verhalten */
  cell.onclick = () => {
    const deg = Math.floor(Math.random()*360);
    const col = "#" + Math.floor(Math.random()*16777215).toString(16);

    cell.style.transform = "rotate(" + deg + "deg)";
    cell.style.background = col;

    /* Chess‑Profil */
    if(i % 2 === 0){
      cell.style.border = "2px solid #66ffaa";
    } else {
      cell.style.border = "2px solid #ffaa66";
    }

    updateScore();
  };

  grid.appendChild(cell);
  cells.push(cell);
}

/* BUTTON FUNKTIONEN */
function rotateAll(){
  cells.forEach(c=>{
    const deg = Math.floor(Math.random()*360);
    c.style.transform = "rotate(" + deg + "deg)";
  });
}

function colorAxioms(){
  cells.forEach((c,i)=>{
    const ax = i % 6;
    let color = "#ffffff";
    if(ax === 1) color = "#66ffaa";
    if(ax === 2) color = "#66aaff";
    if(ax === 3) color = "#ffaa66";
    if(ax === 4) color = "#aa66ff";
    if(ax === 5) color = "#ff6666";
    c.style.background = color;
  });
}

function resetGrid(){
  cells.forEach(c=>{
    c.style.transform = "rotate(0deg)";
    c.style.background = "transparent";
  });
}

/* DRAG + SNAP LOGIK */
function makeDraggable(btn){
  let offsetX = 0, offsetY = 0, dragging = false;

  btn.addEventListener("mousedown", e=>{
    dragging = true;
    offsetX = e.clientX - btn.offsetLeft;
    offsetY = e.clientY - btn.offsetTop;

    btn.style.transform = "translateY(-6px)";
    setTimeout(()=>btn.style.transform = "translateY(0)", 120);
  });

  document.addEventListener("mousemove", e=>{
    if(!dragging) return;
    btn.style.left = (e.clientX - offsetX) + "px";
    btn.style.top = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup", ()=>{
    if(!dragging) return;
    dragging = false;

    const snapSize = window.innerWidth / 3;
    const x = Math.round(btn.offsetLeft / snapSize) * snapSize;
    const y = Math.round(btn.offsetTop / snapSize) * snapSize;

    btn.style.left = x + "px";
    btn.style.top = y + "px";
  });
}

makeDraggable(document.getElementById("btn1"));
makeDraggable(document.getElementById("btn2"));
makeDraggable(document.getElementById("btn3"));
</script>

</body>
</html>
