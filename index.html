<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:20px;
    padding:10px;
    z-index:99999;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  #axis-panel {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:#000;
    border-top:2px solid #7dd3fc;
    z-index:99999;
  }

  #super-panel {
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:99999;
  }

  #jackpot-slot {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ffaa00;
    font-size:26px;
    z-index:99999;
  }

  #combo-wrap {
    position:fixed;
    top:44px;
    left:50%;
    transform:translateX(-50%);
    width:160px;
    z-index:99999;
    text-align:center;
    display:none;
  }

  #combo-label {
    color:#ffaa00;
    font-size:13px;
    margin-bottom:3px;
  }

  #combo-bar-bg {
    width:100%;
    height:6px;
    background:#1f2937;
    border-radius:4px;
    overflow:hidden;
  }

  #combo-bar-fill {
    height:100%;
    background:#ffaa00;
    width:100%;
    transform-origin:left;
  }

  #combo-bar-fill.running {
    animation:comboShrink 1.2s linear forwards;
  }

  @keyframes comboShrink {
    from { width:100%; }
    to { width:0%; }
  }

  @keyframes lureBlink {
    0%, 100% { box-shadow:0 0 4px #ffaa00; background:#0b1220; }
    50% { box-shadow:0 0 20px 6px #ffaa00; background:#3a2a00; }
  }

  button.lure {
    animation:lureBlink 0.5s ease-in-out infinite;
    border-color:#ffaa00;
  }

  #lure-info {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:200000;
    padding:24px;
  }

  #lure-info .box {
    max-width:420px;
    background:#161b26;
    border:2px solid #ffaa00;
    border-radius:12px;
    padding:24px;
    text-align:center;
    font-size:15px;
    line-height:1.5;
    color:#e2e8f0;
  }

  #lure-info .box h3 {
    color:#ffaa00;
    margin-top:0;
  }

  #lure-info button {
    margin-top:16px;
  }

  button {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }

  #final-screen {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:999999;
    padding:20px;
    font-size:22px;
  }

  #newgame-btn {
    position:fixed;
    top:8px;
    right:12px;
    background:#0b1220;
    color:#7dd3fc;
    border:2px solid #7dd3fc;
    padding:8px 16px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    z-index:100000;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>
<div id="combo-wrap">
  <div id="combo-label">Combo: 0 / 3</div>
  <div id="combo-bar-bg"><div id="combo-bar-fill"></div></div>
</div>
<div id="axis-panel"></div>
<div id="super-panel"></div>
<div id="jackpot-slot">Jackpot: —</div>
<div id="grid"></div>
<div id="final-screen"></div>

<div id="lure-info">
  <div class="box">
    <h3>Aufgefallen? 👀</h3>
    <p>Du hast auf den Button geklickt, der am hellsten geblinkt hat.</p>
    <p>Genau mit diesem Trick – auffällige Blink-Reize – arbeiten echte Spielautomaten, damit man weiterspielt, statt nach dem Zufallsprinzip zu wählen.</p>
    <button onclick="document.getElementById('lure-info').style.display='none'">Verstanden</button>
  </div>
</div>

<button id="newgame-btn">ORBIT · Neues Spiel</button>

<script>

/* ============================
   SOUND ENGINE
   Erzeugt Toene direkt im Browser - keine Dateien, keine Lizenzfrage.
   Jeder Aufruf klingt leicht anders (Variation um eine Basisfrequenz),
   genau wie bei echten Slot-Maschinen, wo der Sound nie 1:1 identisch ist.
   ============================ */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq = 440, duration = 0.15, type = "sine"){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.type = type;
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// Hilfsfunktion: Basis-Ton + kleine Zufallsabweichung, damit es nie exakt gleich klingt
function playVariant(baseFreq, spread, duration = 0.15, type = "sine"){
  const freq = baseFreq + (Math.random() * spread * 2 - spread);
  playSound(freq, duration, type);
}

// Klick-Sound (kurz, hell, jedes Mal leicht anders)
function soundClick(){
  playVariant(500, 60, 0.08, "sine");
}

// Achsen-Ergebnis: unterschiedlicher Klang je nach Qualitaet
function soundAxis(quality){
  if(quality === 0) playVariant(300, 20, 0.12, "sine");   // neutral
  if(quality === 1) playVariant(700, 40, 0.15, "triangle"); // gut
  if(quality === 2) playVariant(150, 20, 0.2, "sawtooth");  // schlecht
}

// Super-Button Ergebnis: pro Spiel-Typ ein eigener Grundton, leicht variiert
function soundSuper(kind){
  const map = {
    chess: 600, skat: 550, rome: 650, jackpot: 850
  };
  playVariant(map[kind] || 500, 50, 0.2, "triangle");
}

// Jackpot: kleine aufsteigende Tonfolge, jedes Mal mit variierendem Startton
function soundJackpotFanfare(hits){
  const start = 500 + Math.random()*100;
  for(let i=0; i<Math.min(hits, 6); i++){
    setTimeout(()=> playSound(start + i*90, 0.12, "square"), i*90);
  }
}

/* ============================
   SCORE ENGINE
   ============================ */
let score = 0;
function updateScore(v=1){
  score += v;
  document.getElementById("score").textContent = "Score: " + score;
  checkEnd();
}

function checkEnd(){
  if(score >= 500){
    FINAL("🎉 GAME OVER", "Du hast 500 Punkte erreicht!");
  }
}

/* ============================
   FINAL SCREEN
   ============================ */
function FINAL(title, text){
  STOP_AUTOFINALE();
  const FS = document.getElementById("final-screen");
  FS.innerHTML = `
    <div style="font-size:40px; margin-bottom:20px;">${title}</div>
    <div style="margin-bottom:40px;">${text}</div>
    <div id="cube" style="width:120px; height:120px; border:3px solid #7dd3fc;"></div>
    <button id="final-newgame" style="
      background:#0b1220;
      color:#7dd3fc;
      border:2px solid #7dd3fc;
      padding:12px 20px;
      border-radius:8px;
      font-size:20px;
      cursor:pointer;
      margin-top:40px;
    ">ORBIT · Neues Spiel</button>
  `;

  const rating = SCORE_RANK();
  FS.innerHTML += `<div style="margin-top:20px; font-size:22px; color:#7dd3fc;">${rating}</div>`;

  FS.style.display = "flex";
  CUBE_ANIM();
}

/* ============================
   CUBE ANIMATION
   ============================ */
let cubeInterval = null;
function CUBE_ANIM(){
  let deg = 0;
  const cube = document.getElementById("cube");
  clearInterval(cubeInterval);
  cubeInterval = setInterval(()=>{
    deg += 3;
    cube.style.transform = `rotateY(${deg}deg) rotateX(${deg/2}deg)`;
  }, 30);
}

/* ============================
   GRID
   ============================ */
const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
  "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
  "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
];

const grid = document.getElementById("grid");
const cells = [];

for(let i=0;i<756;i++){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.textContent = symbols[i % symbols.length];

  cell.onclick = () => {
    const deg = Math.floor(Math.random()*360);
    // FIX: padStart sorgt fuer immer 6-stelligen Hex-Wert (keine kaputten Kurzfarben mehr)
    const col = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, "0");
    cell.style.transform = "rotate(" + deg + "deg) scale(1.2)";
    cell.style.background = col;
    cell.style.boxShadow = "0 0 12px " + col;
    setTimeout(()=>cell.style.transform="scale(1)",200);
    soundClick();
    updateScore();
  };

  grid.appendChild(cell);
  cells.push(cell);
}

/* ============================
   AXIS PANEL
   ============================ */
const axisPanel = document.getElementById("axis-panel");
for(let a=0; a<27; a++){
  const btn = document.createElement("button");
  btn.textContent = "A" + (a+1);
  btn.onclick = () => triggerAxis(a, btn);
  axisPanel.appendChild(btn);
}

function triggerAxis(axis, btn){
  const wasLure = (btn === currentLureBtn);
  const quality = Math.floor(Math.random()*3);
  soundAxis(quality);
  if(quality === 0){ btn.style.background = "yellow"; axisMoveNeutral(axis); }
  if(quality === 1){ btn.style.background = "green"; axisMoveGood(axis); }
  if(quality === 2){ btn.style.background = "red"; axisMoveBad(axis); }
  registerCombo();

  if(wasLure){
    btn.classList.remove("lure");
    currentLureBtn = null;
    showLureInfo();
  }
}

/* ============================
   COMBO-SYSTEM (unten, Achsen-Buttons)
   3 Achsen-Buttons innerhalb von 1.2 Sekunden = Bonus.
   Wird das Zeitfenster verpasst, laeuft alles ganz normal ohne Bonus weiter.
   ============================ */
const COMBO_WINDOW_MS = 1200;
const COMBO_NEEDED = 3;
let comboCount = 0;
let comboResetTimer = null;

const comboWrap = document.getElementById("combo-wrap");
const comboLabel = document.getElementById("combo-label");
const comboBar = document.getElementById("combo-bar-fill");

function registerCombo(){
  comboCount++;
  comboLabel.textContent = `Combo: ${comboCount} / ${COMBO_NEEDED}`;
  comboWrap.style.display = "block";

  // Balken neu starten (Trick: Animation kurz entfernen und neu anhaengen, damit sie neu abspielt)
  comboBar.classList.remove("running");
  void comboBar.offsetWidth; // erzwingt Reflow
  comboBar.classList.add("running");

  clearTimeout(comboResetTimer);

  if(comboCount >= COMBO_NEEDED){
    triggerComboBonus();
    resetCombo();
    return;
  }

  comboResetTimer = setTimeout(()=>{
    // Zeitfenster verpasst -> ganz normal, kein Bonus
    resetCombo();
  }, COMBO_WINDOW_MS);
}

function resetCombo(){
  comboCount = 0;
  comboResetTimer = null;
  comboBar.classList.remove("running");
  setTimeout(()=>{ comboWrap.style.display = "none"; }, 150);
}

function triggerComboBonus(){
  const bonus = 25;
  updateScore(bonus);
  soundJackpotFanfare(4);
  comboLabel.textContent = `⚡ COMBO! +${bonus}`;
  comboLabel.style.color = "#22c55e";
  setTimeout(()=>{ comboLabel.style.color = "#ffaa00"; }, 800);
}

/* ============================
   LURE-BUTTON (paedagogisch)
   Alle paar Sekunden blinkt zufaellig EIN Achsen-Button besonders auffaellig.
   Klickt der Spieler genau diesen, kommt eine ehrliche Aufklaerung darueber,
   dass er auf den visuellen Reiz reagiert hat - kein Trick zum Weiterspielen,
   sondern das Gegenteil: Sichtbarmachen des Mechanismus.
   ============================ */
let currentLureBtn = null;
let lureIntervalTimer = null;

function startLureCycle(){
  stopLureCycle();
  scheduleLure();
}

function scheduleLure(){
  const delay = 4000 + Math.random()*4000; // alle 4-8 Sekunden ein neuer Koeder
  lureIntervalTimer = setTimeout(()=>{
    setLureButton();
    scheduleLure();
  }, delay);
}

function stopLureCycle(){
  clearTimeout(lureIntervalTimer);
  if(currentLureBtn) currentLureBtn.classList.remove("lure");
  currentLureBtn = null;
}

function setLureButton(){
  if(currentLureBtn) currentLureBtn.classList.remove("lure");
  const idx = Math.floor(Math.random()*axisPanel.children.length);
  currentLureBtn = axisPanel.children[idx];
  currentLureBtn.classList.add("lure");

  // Koeder blinkt max. 3 Sekunden, dann verschwindet er von selbst wieder (falls nicht geklickt)
  setTimeout(()=>{
    if(currentLureBtn){
      currentLureBtn.classList.remove("lure");
      currentLureBtn = null;
    }
  }, 3000);
}

function showLureInfo(){
  document.getElementById("lure-info").style.display = "flex";
}

function axisMoveNeutral(axis){
  const start = axis * 28;
  const end = start + 28;
  for(let i=start; i<end; i++){
    cells[i].style.background = "#333";
  }
}

function axisMoveGood(axis){
  const start = axis * 28;
  const end = start + 28;
  for(let i=start; i<end; i++){
    cells[i].style.background = "#00aa00";
    cells[i].style.transform = "scale(1.1)";
  }
  updateScore();
}

function axisMoveBad(axis){
  const start = axis * 28;
  const end = start + 28;
  for(let i=start; i<end; i++){
    cells[i].style.background = "#aa0000";
    cells[i].style.transform = "rotate(10deg)";
  }
}

/* ============================
   SUPER PANEL
   ============================ */
const superPanel = document.getElementById("super-panel");
const superNames = [
  "Schach","Skat","Rommé",
  "Jackpot","Domino","Combo",
  "Bonus","Axiom","Orbit"
];

for(let i=0;i<9;i++){
  const btn = document.createElement("button");
  btn.textContent = superNames[i];
  btn.onclick = () => triggerSuper(i);
  superPanel.appendChild(btn);
}

function triggerSuper(i){
  const r = Math.floor(Math.random()*4);
  if(r === 0) superChess(i);
  if(r === 1) superSkat(i);
  if(r === 2) superRome(i);
  if(r === 3) superJackpot(i);
}

function superChess(i){
  const axis = Math.floor(Math.random()*27);
  axisMoveGood(axis);
  const pieces = ["König","Dame","Turm","Springer","Läufer"];
  const piece = pieces[Math.floor(Math.random()*pieces.length)];
  superPanel.children[i].textContent = "Schach: " + piece;
  soundSuper("chess");
  updateScore(4);
}

function superSkat(i){
  const cards = ["♥","♦","♣","♠"];
  const card = cards[Math.floor(Math.random()*cards.length)];
  superPanel.children[i].textContent = "Skat: " + card;
  soundSuper("skat");
  updateScore(3);
}

function superRome(i){
  const num = Math.floor(Math.random()*13)+1;
  const col = ["red","blue","green"][Math.floor(Math.random()*3)];
  superPanel.children[i].style.background = col;
  superPanel.children[i].textContent = "Rommé: " + num;
  soundSuper("rome");
  updateScore(2);
}

function superJackpot(i){
  const axiomSymbols = ["✦","✧","✪","✫","✬","✭"];
  const sym = axiomSymbols[Math.floor(Math.random()*axiomSymbols.length)];
  superPanel.children[i].textContent = "Jackpot: " + sym;
  const hits = Math.floor(Math.random()*10)+1;
  for(let h=0; h<hits; h++){
    const cellIndex = Math.floor(Math.random()*756);
    cells[cellIndex].style.background = "#ffaa00";
    cells[cellIndex].style.transform = "scale(1.2)";
  }
  soundSuper("jackpot");
  soundJackpotFanfare(hits);
  updateScore(hits * 5);
  document.getElementById("jackpot-slot").textContent = "Jackpot: " + sym;
  if(hits > 15){
    FINAL("💥 JACKPOT‑OVERLOAD", "Zu viele Treffer!");
  }
}

/* ============================
   AUTO-FINALE
   FIX: als benannter, stoppbarer Timer statt anonymem setTimeout,
   damit NEWGAME() ihn sauber zuruecksetzen kann.
   ============================ */
let autoFinaleTimer = null;

function START_AUTOFINALE(){
  STOP_AUTOFINALE();
  autoFinaleTimer = setTimeout(()=>{
    FINAL("ALLXALL · 360°", "Orbit abgeschlossen · System stabil.");
  }, 13000);
}

function STOP_AUTOFINALE(){
  if(autoFinaleTimer){
    clearTimeout(autoFinaleTimer);
    autoFinaleTimer = null;
  }
}

START_AUTOFINALE();
startLureCycle();

/* ============================
   PERFECT RESET ENGINE
   ============================ */

function STOP_CUBE(){
  if(cubeInterval){
    clearInterval(cubeInterval);
    cubeInterval = null;
  }
}

function RESET_FINAL(){
  const FS = document.getElementById("final-screen");
  FS.style.display = "none";
  FS.innerHTML = "";
  STOP_CUBE();
}

function RESET_SCORE(){
  score = 0;
  document.getElementById("score").textContent = "Score: 0";
}

function RESET_GRID(){
  cells.forEach(c=>{
    c.style.background = "";
    c.style.transform = "";
    c.style.boxShadow = "";
  });
}

function RESET_AXIS_PANEL(){
  const axisPanel = document.getElementById("axis-panel");
  for(let i=0; i<axisPanel.children.length; i++){
    const btn = axisPanel.children[i];
    btn.style.background = "#0b1220";
    btn.textContent = "A" + (i+1);
  }
}

function RESET_SUPER_PANEL(){
  const superPanel = document.getElementById("super-panel");
  const names = ["Schach","Skat","Rommé","Jackpot","Domino","Combo","Bonus","Axiom","Orbit"];
  for(let i=0; i<superPanel.children.length; i++){
    const btn = superPanel.children[i];
    btn.style.background = "#0b1220";
    btn.textContent = names[i];
  }
}

function RESET_JACKPOT(){
  document.getElementById("jackpot-slot").textContent = "Jackpot: —";
}

function SCORE_RANK(){
  let rank = Math.floor(100 + Math.random()*200);
  return `Platz ${rank} · für das erste Mal sehr gut · stabile Achsenführung · Orbit sauber gehalten`;
}

function NEWGAME(){
  RESET_FINAL();
  RESET_SCORE();
  RESET_GRID();
  RESET_AXIS_PANEL();
  RESET_SUPER_PANEL();
  RESET_JACKPOT();
  resetCombo();
  START_AUTOFINALE(); // FIX: Timer startet mit dem neuen Spiel neu, statt vom alten Laden der Seite zu stammen
  startLureCycle();
}

document.getElementById("newgame-btn").onclick = NEWGAME;

document.addEventListener("click", e=>{
  if(e.target.id === "final-newgame"){
    NEWGAME();
  }
});

</script>

</body>
</html>
