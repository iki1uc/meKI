<script type="module">

/* TEAM-WORK MODULES (RUN) */
import { RealityPulse } from "./RUN/realitypulse.js";
import { MIACORE } from "./RUN/mia-core.js";
import { MIATribunal } from "./RUN/mia-tribunal.js";
import { techPulse } from "./RUN/tech.js";
import { nextGate, orbitGate } from "./RUN/gates.js";
import { stabiliseRoom } from "./RUN/wloch.js";
import { ecoShift } from "./RUN/eco-shift.js";

/* GA ↔ MIE ROOM SYSTEM */
import { loadAllRooms } from "./GateRoomLoader.js";

/* 3-AXIOM-IN/OUT SYSTEM */
const AXIOM = {
    IN: ["GA-IN", "meKI-IN", "MIE-IN"],
    OUT: ["GA-OUT", "meKI-OUT", "MIE-OUT"]
};

/* TEAM-WORK META */
let rooms = {};
let current = null;
let tick = 0;
let gate = "GA";          // Start-Gate
let axiomMode = "IN";     // Start-Axiom
let slide = 0;            // Slide-3 System

async function initTeamWork(){

    rooms = await loadAllRooms();

    /* SPIEL STARTET BEI meKI */
    current = rooms.meKI;

    console.log("TEAM-WORK START:", {
        startRoom: "meKI",
        axiomMode,
        gate
    });
}

initTeamWork();

/* SLIDE-3 AXIOM SYSTEM */
function slideAxiom(){
    slide++;

    if(slide % 3 === 1) axiomMode = "IN";
    if(slide % 3 === 2) axiomMode = "OUT";
    if(slide % 3 === 0) axiomMode = "IN-OUT";

    console.log("AXIOM-MODE:", axiomMode);
}

/* TEAM-WORK LOOP */
setInterval(()=>{

    /* 1. WLOCH-PULSE */
    const pulse = stabiliseRoom(current);

    /* 2. 756-TECH */
    const tech = techPulse(tick);

    /* 3. MODE (ALL-IN / ALL-OUT) */
    const mode = (tick % 2 === 0) ? "ALL-IN" : "ALL-OUT";

    /* 4. 3-RESPO-GATE */
    gate = nextGate(gate);

    /* 5. ALLXALL-ORBIT */
    gate = orbitGate(tick);

    /* 6. RealityPulse */
    const reality = RealityPulse(current, tick);

    /* 7. MIA-CORE + TRIBUNAL */
    const verdict = MIATribunal({
        pulse,
        tech,
        mode,
        gate,
        axiomMode,
        slide
    });

    console.log("TEAM-WORK VERDICT:", verdict);

    /* 8. ECO-3D SHIFT */
    ecoShift(reality);

    /* 9. ROOM ROUTING */
    if(pulse.soll === 2) current = rooms.meKI;
    if(pulse.soll === 3) current = rooms.MIE;
    if(pulse.soll === 1) current = rooms.GA;

    /* 10. SLIDE-3 AXIOM */
    slideAxiom();

    tick++;

}, 300);

</script>
