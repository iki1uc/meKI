<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · Continuum‑Clock · 0‑Schalter‑Detector</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #clock {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:radial-gradient(circle at center, #0b1220, #000);
  }

  .gear {
    width:140px;
    height:140px;
    border:6px solid #7dd3fc;
    border-radius:50%;
    margin:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    transition:transform 1s linear;
  }

  #panel {
    position:fixed;
    bottom:0;
    left:0; right:0;
    background:#000;
    border-top:2px solid #7dd3fc;
    padding:20px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }
  .btn:hover {
    background:#12263a;
    transform:scale(1.05);
  }
</style>
</head>

<body>

<div id="clock">
  <div id="sun" class="gear">☀</div>
  <div id="moon" class="gear">☾</div>
  <div id="earth" class="gear">⊕</div>

  <pre id="info"></pre>
</div>

<div id="panel">
  <button class="btn" onclick="rotateSun()">Sonne</button>
  <button class="btn" onclick="rotateMoon()">Mond</button>
  <button class="btn" onclick="rotateEarth()">Erde</button>
  <button class="btn" onclick="axiom()">Axiom</button>
  <button class="btn" onclick="detect()">0‑Schalter‑Check</button>
  <button class="btn" onclick="resetClock()">Reset</button>
</div>

<script>
function rotateSun(){
  document.getElementById("sun").style.transform =
    "rotate(" + (Math.random()*360) + "deg)";
}
function rotateMoon(){
  document.getElementById("moon").style.transform =
    "rotate(" + (Math.random()*360) + "deg)";
}
function rotateEarth(){
  document.getElementById("earth").style.transform =
    "rotate(" + (Math.random()*360) + "deg)";
}

function resetClock(){
  ["sun","moon","earth"].forEach(id=>{
    document.getElementById(id).style.transform="rotate(0deg)";
  });
  document.getElementById("info").textContent="";
}

function axiom(){
  const info = document.getElementById("info");
  const deg = Math.floor(Math.random()*360);

  let ax="H";
  if(deg<120) ax="H";
  else if(deg<240) ax="B";
  else ax="T";

  info.textContent = "Axiom: " + ax + " (" + deg + "°)";
}

function detect(){
  const info = document.getElementById("info");
  const panel = document.getElementById("panel");

  const count = panel.querySelectorAll(".btn").length;

  if(count === 0){
    info.textContent = "Continuum‑Zustand: 0‑Schalter\nAxiom: NULL\nZeitlinie: Reset";
  } else {
    info.textContent = "Schalter aktiv: " + count;
  }
}
</script>

</body>
</html>
