<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 Continuum Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  /* 756 GRID: 729 Achsenpunkte + 27 Kontrollpunkte */
  #grid {
    position:fixed;
    top:0; left:0; right:0; bottom:140px;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  .cell:hover {
    background:#12263a;
    transform:scale(1.08);
  }

  /* PANEL */
  #panel {
    position:fixed;
    bottom:0;
    left:0; right:0;
    background:#000;
    border-top:2px solid #7dd3fc;
    padding:20px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }
  .btn:hover {
    background:#12263a;
    transform:scale(1.05);
  }
</style>
</head>

<body>

<div id="grid"></div>

<div id="panel">
  <button class="btn" onclick="rotateAll()">Alle 756 drehen</button>
  <button class="btn" onclick="colorAxioms()">Axiom‑Farben</button>
  <button class="btn" onclick="resetGrid()">Reset</button>
</div>

<script>
/* 756 GRID ERZEUGEN */
const grid = document.getElementById("grid");
const cells = [];

for(let i=0;i<756;i++){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.textContent = "⚙";
  cell.dataset.index = i;
  grid.appendChild(cell);
  cells.push(cell);

  cell.onclick = () => {
    const deg = Math.floor(Math.random()*360);
    cell.style.transform = "rotate(" + deg + "deg)";
    cell.style.background = "#0b1220";
  };
}

/* ALLE DREHEN */
function rotateAll(){
  cells.forEach(c=>{
    const deg = Math.floor(Math.random()*360);
    c.style.transform = "rotate(" + deg + "deg)";
  });
}

/* AXIOM‑FARBEN */
function colorAxioms(){
  cells.forEach((c,i)=>{
    const ax = i % 6; // 6 Axiome

    let color = "#ffffff"; // SET
    if(ax === 1) color = "#66ffaa"; // H
    if(ax === 2) color = "#66aaff"; // B
    if(ax === 3) color = "#ffaa66"; // T
    if(ax === 4) color = "#aa66ff"; // KI
    if(ax === 5) color = "#ff6666"; // ER

    c.style.background = color;
  });
}

/* RESET */
function resetGrid(){
  cells.forEach(c=>{
    c.style.transform = "rotate(0deg)";
    c.style.background = "transparent";
  });
}
</script>

</body>
</html>
