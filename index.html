<script>
(async function () {

    /* -------------------------------
       ANKER DATEN LADEN
    --------------------------------*/
    const anker = await fetch("ANKER.json").then(r => r.json()).catch(() => null);
    const raw = await fetch("ANKER.raw").then(r => r.text()).catch(() => "");
    document.getElementById("axis-list").innerText = raw || "Keine Achsen gefunden";


    /* -------------------------------
       AXI ENGINE
    --------------------------------*/
    const axi = AXI_CORE();
    document.getElementById("axis-status").innerText =
        axi ? "Achsen stabil" : "Achsenfehler";


    /* -------------------------------
       RESPO ENGINE
    --------------------------------*/
    const respo = RESPO_CORE(anker || {});
    document.getElementById("respo-status").innerText =
        `Score: ${respo.score}\nStatus: ${respo.ok ? "STABIL" : "KRITISCH"}`;


    /* -------------------------------
       ID MODUS ERKENNEN
    --------------------------------*/
    let idMode = "neutral";
    if (ID_KOOP?.active) idMode = "koop";
    if (ID_POOK?.active) idMode = "pook";

    const idMap = {
        koop: ID_KOOP,
        neutral: ID_NEUTRAL,
        pook: ID_POOK
    };

    document.getElementById("id-status").innerText =
        `Modus: ${idMode.toUpperCase()}\nInfo: ${idMap[idMode].info()}`;


    /* -------------------------------
       CONTINUUM + CIBIK
    --------------------------------*/
    const cibik = new CIBIK();
    await cibik.init();

    const hbt = new ContinuumHBT();
    const link = new ContinuumLink(cibik.kernel, hbt);


    /* -------------------------------
       ORBIT TEST
    --------------------------------*/
    function testOrbit() {
        console.log("=== ORBIT TEST START ===");

        hbt.setAxis("H");
        link.sync(); // IX

        hbt.setAxis("B");
        link.sync(); // XI

        hbt.setAxis("T");
        link.sync(); // X4

        cibik.orbitAll(); // IX + XI + X4

        console.log("=== ORBIT TEST END ===");
    }

    testOrbit();


    /* -------------------------------
       CSV VALIDIERUNG
    --------------------------------*/
    function validateCSV(layer) {
