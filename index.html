<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:20px;
    padding:10px;
    z-index:99999;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  #axis-panel {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:#000;
    border-top:2px solid #7dd3fc;
    z-index:99999;
  }

  #super-panel {
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:99999;
  }

  #jackpot-slot {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ffaa00;
    font-size:26px;
    z-index:99999;
  }

  button {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }

  /* FINAL SCREEN */
  #final-screen {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:999999;
    padding:20px;
    font-size:22px;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>
<div id="axis-panel"></div>
<div id="super-panel"></div>
<div id="jackpot-slot">Jackpot: —</div>

<div id="grid"></div>
<div id="final-screen"></div>

<script>
/* ⭐ SOUND UNLOCK – Pflicht für ALLE Browser */
let soundUnlocked = false;

document.body.addEventListener("click", () => {
  if(!soundUnlocked){
    const a = new Audio();
    a.play().catch(()=>{});
    soundUnlocked = true;
    console.log("Sound freigeschaltet.");
  }
}, { once:true });

  
  /* GRID SYMBOLS */
const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
  "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
  "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
];

/* SCORE */
let score = 0;
function updateScore(){
  score++;
  document.getElementById("score").textContent = "Score: " + score;
}

/* GRID */
const grid = document.getElementById("grid");
const cells = [];

for(let i=0;i<756;i++){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.textContent = symbols[i % symbols.length];

  cell.onclick = () => {
    const deg = Math.floor(Math.random()*360);
    const col = "#" + Math.floor(Math.random()*16777215).toString(16);

    cell.style.transform = "rotate(" + deg + "deg)";
    cell.style.background = col;

    if(i % 2 === 0){
      cell.style.border = "2px solid #66ffaa";
    } else {
      cell.style.border = "2px solid #ffaa66";
    }

    updateScore();
  };

  grid.appendChild(cell);
  cells.push(cell);
}

/* AXIS PANEL */
const axisPanel = document.getElementById("axis-panel");

for(let a=0; a<27; a++){
  const btn = document.createElement("button");
  btn.textContent = "A" + (a+1);

  btn.onclick = () => triggerAxis(a, btn);

  axisPanel.appendChild(btn);
}

function triggerAxis(axis, btn){
  const quality = Math.floor(Math.random()*3);

  if(quality === 0){
    btn.style.background = "yellow";
    axisMoveNeutral(axis);
  }
  if(quality === 1){
    btn.style.background = "green";
    axisMoveGood(axis);
  }
  if(quality === 2){
    btn.style.background = "red";
    axisMoveBad(axis);
  }
}

function axisMoveNeutral(axis){
  const start = axis * 28;
  const end = start + 28;

  for(let i=start; i<end; i++){
    cells[i].style.background = "#333";
  }
}

function axisMoveGood(axis){
  const start = axis * 28;
  const end = start + 28;

  for(let i=start; i<end; i++){
    cells[i].style.background = "#00aa00";
    cells[i].style.transform = "scale(1.1)";
  }

  updateScore();
}

function axisMoveBad(axis){
  const start = axis * 28;
  const end = start + 28;

  for(let i=start; i<end; i++){
    cells[i].style.background = "#aa0000";
    cells[i].style.transform = "rotate(10deg)";
  }
}

/* SUPER PANEL */
const superPanel = document.getElementById("super-panel");
const superNames = [
  "Schach","Skat","Rommé",
  "Jackpot","Domino","Combo",
  "Bonus","Axiom","Orbit"
];

for(let i=0;i<9;i++){
  const btn = document.createElement("button");
  btn.textContent = superNames[i];

  btn.onclick = () => triggerSuper(i);

  superPanel.appendChild(btn);
}

function triggerSuper(i){
  const r = Math.floor(Math.random()*4);

  if(r === 0) superChess(i);
  if(r === 1) superSkat(i);
  if(r === 2) superRome(i);
  if(r === 3) superJackpot(i);
}

function superChess(i){
  const axis = Math.floor(Math.random()*27);
  axisMoveGood(axis);

  const pieces = ["König","Dame","Turm","Springer","Läufer"];
  const piece = pieces[Math.floor(Math.random()*pieces.length)];

  superPanel.children[i].textContent = "Schach: " + piece;

  score += 4;
  updateScore();
}

function superSkat(i){
  const cards = ["♥","♦","♣","♠"];
  const card = cards[Math.floor(Math.random()*cards.length)];

  superPanel.children[i].textContent = "Skat: " + card;

/* ⭐ NOVOLINO – Euphorische Adaptive Sound Engine */
const novolinoPool = {
  mp3: [
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_0f1e3b.mp3?filename=game-notification-113985.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_6f1b1f.mp3?filename=arcade-melody-100575.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_5f1b1f.mp3?filename=arcade-win-100574.mp3"
  ],
  wav: [
    "https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.wav",
    "https://assets.mixkit.co/sfx/preview/mixkit-soft-ambient-tone-286.wav"
  ],
  aac: [
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_0f1e3b.aac?filename=game-notification-113985.aac"
  ]
};

/* ⭐ Fallback Loader: mp3 → aac → wav */
function playNovolino(vol = 0.35){
  let src = null;

  if(novolinoPool.mp3.length) src = novolinoPool.mp3[Math.floor(Math.random()*novolinoPool.mp3.length)];
  else if(novolinoPool.aac.length) src = novolinoPool.aac[Math.floor(Math.random()*novolinoPool.aac.length)];
  else if(novolinoPool.wav.length) src = novolinoPool.wav[Math.floor(Math.random()*novolinoPool.wav.length)];

  if(!src) return;

  const audio = new Audio(src);
  audio.volume = vol;
  audio.play().catch(()=>{});
}

/* ⭐ Adaptive Euphoric Meta-Sound */
setInterval(()=>{

  // META‑Boost beeinflusst Euphorie
  const boost = metaBoost; // 1–5

  // AIR/AIV beeinflusst Intensität
  const intensity = Math.min(1, boost / 5);

  // Euphorischer Sound
  playNovolino(0.25 + intensity * 0.15);

}, 4000); // alle 4 Sekunden ein sanfter Euphorie‑Impuls

  
  score += 3;
  updateScore();
}

function superRome(i){
  const num = Math.floor(Math.random()*13)+1;
  const col = ["red","blue","green"][Math.floor(Math.random()*3)];

  superPanel.children[i].style.background = col;
  superPanel.children[i].textContent = "Rommé: " + num;

  score += 2;
  updateScore();
}

function superJackpot(i){
  const axiomSymbols = ["✦","✧","✪","✫","✬","✭"];
  const sym = axiomSymbols[Math.floor(Math.random()*axiomSymbols.length)];

  superPanel.children[i].textContent = "Jackpot: " + sym;

  const hits = Math.floor(Math.random()*10)+1;

  for(let h=0; h<hits; h++){
    const cellIndex = Math.floor(Math.random()*756);
    cells[cellIndex].style.background = "#ffaa00";
    cells[cellIndex].style.transform = "scale(1.2)";
  }

  score += hits * 5;
  updateScore();

  document.getElementById("jackpot-slot").textContent = "Jackpot: " + sym;
}

/* FINAL‑SCREEN */
function FINAL(title, text){
  const FS = document.getElementById("final-screen");
  FS.innerHTML = `
    <div style="font-size:40px; margin-bottom:20px;">${title}</div>
    <div style="margin-bottom:40px;">${text}</div>
    <div id="cube" style="width:120px; height:120px; border:3px solid #7dd3fc;"></div>
  `;
  FS.style.display = "flex";
  CUBE_ANIM();
}

/* 3D‑Zauberwürfel‑Animation */
function CUBE_ANIM(){
  let deg = 0;
  const cube = document.getElementById("cube");
  setInterval(()=>{
    deg += 3;
    cube.style.transform = `rotateY(${deg}deg) rotateX(${deg/2}deg)`;
  }, 30);
}

/* OUTRO MIT 9 BUCHSTABEN */
function OUTRO(){
  FINAL("MEKIMAGIC", "Danke fürs Spielen · Das Kontinuum schließt sich.");
}

/* FINALE TRIGGER — 13 Sekunden */
setTimeout(()=>{

  const r = Math.floor(Math.random()*5);

  if(r === 0) FINAL("GA · meKI · MIE", "Axiomisches Dreieck abgeschlossen.");
  if(r === 1) FINAL("756‑Achsen‑Finale", "Magic‑Grid vollständig durchlaufen.");
  if(r === 2) FINAL("2268‑Würfel‑Finale", "ALLXALL‑Kontinuum stabilisiert.");
  if(r === 3) FINAL("ALLXALL · 360°", "Orbit abgeschlossen · System stabil.");
  if(r === 4) OUTRO();

}, 13000);
</script>

</body>
</html>
