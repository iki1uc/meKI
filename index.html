<script>
(async function () {

    const cibik = new CIBIK();
    await cibik.init();

    const hbt = new ContinuumHBT();
    const link = new ContinuumLink(cibik.kernel, hbt);

    function testOrbit() {
        console.log("=== ORBIT TEST START ===");

        hbt.setAxis("H");
        link.sync(); // IX

        hbt.setAxis("B");
        link.sync(); // XI

        hbt.setAxis("T");
        link.sync(); // X4

        cibik.orbitAll(); // IX + XI + X4

        console.log("=== ORBIT TEST END ===");
    }

    testOrbit()

console.log("Layer 2 OK:", validateCSV(cibik.layer2));
