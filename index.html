<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  /* ⭐ ALLXALL SCORE */
  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:32px;
    padding:10px;
    z-index:99999;
    text-shadow:0 0 10px #00eaff, 0 0 20px #00eaff;
    transition:transform .2s ease, color .2s ease;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  #axis-panel {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:#000;
    border-top:2px solid #7dd3fc;
    z-index:99999;
  }

  #super-panel {
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:99999;
  }

  #jackpot-slot {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ffaa00;
    font-size:26px;
    z-index:99999;
  }

  button {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }

  #final-screen {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:999999;
    padding:20px;
    font-size:22px;
  }

  /* ⭐ START-SCREEN */
  #start-screen {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:#000; color:#7dd3fc; font-family:monospace;
    display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; z-index:999999;
    padding:20px; font-size:22px;
  }
</style>
</head>

<body>

<!-- ⭐ SCORE -->
<div id="score">Score: 0</div>

<!-- ⭐ PANELS -->
<div id="axis-panel"></div>
<div id="super-panel"></div>
<div id="jackpot-slot">Jackpot: —</div>

<!-- ⭐ GRID -->
<div id="grid"></div>

<!-- ⭐ FINAL SCREEN -->
<div id="final-screen"></div>

<!-- ⭐ START SCREEN -->
<div id="start-screen">
  <div style="font-size:40px; margin-bottom:20px;">meKI · ALLXALL</div>

  <button id="mode-score" style="margin:10px; padding:12px 20px;">Spiel‑Score‑Modus</button>
  <button id="mode-info" style="margin:10px; padding:12px 20px;">Spiel‑Erklär‑Modus</button>
  <button id="mode-contact" style="margin:10px; padding:12px 20px;">Spiel‑Kontakt‑Modus</button>

  <div id="discord-box" style="margin-top:40px; font-size:18px; opacity:0.8;">
    <div>──────────────</div>
    <div id="discord-line">Discord: @iki1uc</div>
    <div>──────────────</div>
  </div>
</div>

<script>
/* ⭐ GRID SYMBOLS */
const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
  "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
  "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
];

/* ⭐ SCORE SYSTEM */
let score = 0;
let displayScore = 0;

function updateScore(amount = 1){
  score += amount;

  const scoreEl = document.getElementById("score");

  scoreEl.style.transform = "scale(1.3)";
  scoreEl.style.color = "#00eaff";

  setTimeout(()=>{
    scoreEl.style.transform = "scale(1)";
    scoreEl.style.color = "#7dd3fc";
  }, 150);

  const step = () => {
    if(displayScore < score){
      displayScore++;
      scoreEl.textContent = "Score: " + displayScore;
      requestAnimationFrame(step);
    }
  };
  step();
}

/* ⭐ GRID BUILD */
const grid = document.getElementById("grid");
const cells = [];

for(let i=0;i<756;i++){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.textContent = symbols[i % symbols.length];

  cell.onclick = () => {
    const deg = Math.floor(Math.random()*360);
    const col = "#" + Math.floor(Math.random()*16777215).toString(16);

    cell.style.transform = "rotate(" + deg + "deg)";
    cell.style.background = col;

    updateScore();
  };

  grid.appendChild(cell);
  cells.push(cell);
}

/* ⭐ AXIS PANEL */
const axisPanel = document.getElementById("axis-panel");

for(let a=0; a<27; a++){
  const btn = document.createElement("button");
  btn.textContent = "A" + (a+1);

  btn.onclick = () => updateScore(3);

  axisPanel.appendChild(btn);
}

/* ⭐ SUPER PANEL */
const superPanel = document.getElementById("super-panel");
const superNames = [
  "Schach","Skat","Rommé",
  "Jackpot","Domino","Combo",
  "Bonus","Axiom","Orbit"
];

for(let i=0;i<9;i++){
  const btn = document.createElement("button");
  btn.textContent = superNames[i];

  btn.onclick = () => triggerSuper(i);

  superPanel.appendChild(btn);
}

/* ⭐ SUPER FUNCTIONS */
function triggerSuper(i){
  if(i === 3){
    superJackpot(i);
  } else {
    updateScore(5);
  }
}

/* ⭐ JACKPOT FX */
function superJackpot(i){
  superPanel.children[i].textContent = "Jackpot!";

  for(let h=0; h<10; h++){
    const cellIndex = Math.floor(Math.random()*756);
    cells[cellIndex].style.background = "#ffaa00";
    cells[cellIndex].style.transform = "scale(1.2)";
  }

  updateScore(50);
  triggerJackpotFX();
}

/* ⭐ LIVE CASINO SOUND ENGINE */
const liveSounds = {
  announce: [
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_0f1e3b.mp3?filename=game-notification-113985.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f3b1f.mp3?filename=arcade-bleep-1-100571.mp3"
  ],
  rise: [
    "https://cdn.pixabay.com/download/audio/2021/08/09/audio_6d1f2a.mp3?filename=slot-machine-6891.mp3",
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c1e3b.mp3?filename=game-level-up-113986.mp3"
  ],
  explode: [
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_3f1b1f.mp3?filename=arcade-explosion-100573.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_2f1b1f.mp3?filename=arcade-bomb-100572.mp3"
  ],
  winloop: [
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_5f1b1f.mp3?filename=arcade-win-100574.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_6f1b1f.mp3?filename=arcade-melody-100575.mp3"
  ],
  end: [
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_7f1b1f.mp3?filename=arcade-end-100576.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_8f1b1f.mp3?filename=arcade-chime-100577.mp3"
  ]
};

function playFX(url, vol=0.45){
  const a = new Audio(url);
  a.volume = vol;
  a.play().catch(()=>{});
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function triggerJackpotFX(){
  playFX(pick(liveSounds.announce), 0.65);
  setTimeout(()=> playFX(pick(liveSounds.rise), 0.55), 600);
  setTimeout(()=> playFX(pick(liveSounds.explode), 0.65), 1400);
  setTimeout(()=> playFX(pick(liveSounds.winloop), 0.45), 2000);
  setTimeout(()=> playFX(pick(liveSounds.end), 0.55), 3500);
}

document.body.addEventListener("click", ()=>{
  window.soundUnlocked = true;
}, { once:true });

/* ⭐ META‑SYSTEM (7SINN unsichtbar) */
let metaBoost = 1;
setInterval(()=>{
  metaBoost = Math.floor(Math.random()*5)+1; // 1–5 Boost
}, 1000);

const oldScore = updateScore;
updateScore = function(amount = 1){
  oldScore(amount * metaBoost);
};

const oldJackpotFX = triggerJackpotFX;
triggerJackpotFX = function(){
  updateScore(metaBoost * 10);
  oldJackpotFX();
};

/* ⭐ START-SCREEN LOGIK */
document.getElementById("mode-score").onclick = () => startGame("SCORE");
document.getElementById("mode-info").onclick = () => startGame("INFO");
document.getElementById("mode-contact").onclick = () => startGame("CONTACT");

function startGame(mode){
  window.currentMode = mode;

  AIR_AIV_Stabilize();

  document.getElementById("start-screen").style.display = "none";

  if(mode === "INFO"){
    alert("Erklär-Modus aktiviert.\nDas Spiel zeigt dir Hinweise und Tipps.");
  }
  if(mode === "CONTACT"){
    alert("Kontakt-Modus aktiviert.\nDiscord-Adresse sichtbar.");
  }
}

/* ⭐ AIR / AIV / XI / IX / X4 Stabilisierung */
function AIR_AIV_Stabilize(){
  window.onerror = function(){
    console.log("AIR: Fehler abgefangen — Spiel bleibt stabil.");
    return true;
  };

  window.addEventListener("unhandledrejection", ()=>{
    console.log("AIV: Promise-Fehler abgefangen.");
  });
}

/* ⭐ NEUSTART-TASTE */
const restartBtn = document.createElement("button");
restartBtn.textContent = "NEUSTART";
restartBtn.style.cssText = `
  position:fixed; top:10px; right:10px;
  background:#ffaa00; color:#000; padding:10px 20px;
  border:none; border-radius:6px; z-index:999999;
  cursor:pointer; font-weight:bold;
`;
restartBtn.onclick = resetGame;

document.body.appendChild(restartBtn);

/* ⭐ RESET */
function resetGame(){
  score = 0;
  displayScore = 0;
  document.getElementById("score").textContent = "Score: 0";

  cells.forEach(c=>{
    c.style.background = "#000";
    c.style.transform = "scale(1)";
  });

  document.getElementById("jackpot-slot").textContent = "Jackpot: —";

  document.getElementById("start-screen").style.display = "flex";
}

</script>

</body>
</html>
