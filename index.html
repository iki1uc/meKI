<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:20px;
    padding:10px;
    z-index:99999;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  #axis-panel {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:#000;
    border-top:2px solid #7dd3fc;
    z-index:99999;
  }

  #super-panel {
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:99999;
  }

  #jackpot-slot {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ffaa00;
    font-size:26px;
    z-index:99999;
  }

  button {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }

  /* FINAL SCREEN */
  #final-screen {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:999999;
    padding:20px;
    font-size:22px;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>
<div id="axis-panel"></div>
<div id="super-panel"></div>
<div id="jackpot-slot">Jackpot: —</div>

<div id="grid"></div>
<div id="final-screen"></div>

<script>
/* GRID SYMBOLS */
const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
  "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
  "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
];
<!-- JACKPOT SOUND ENGINE -->
<script>
/* SOUND FILES — du kannst beliebig erweitern */
const jackpotSounds = {
  announce: [
    "sounds/jp_announce_1.mp3",
    "sounds/jp_announce_2.mp3",
    "sounds/jp_announce_3.mp3"
  ],
  rise: [
    "sounds/jp_rise_1.mp3",
    "sounds/jp_rise_2.mp3"
  ],
  explode: [
    "sounds/jp_explode_1.mp3",
    "sounds/jp_explode_2.mp3"
  ],
  winloop: [
    "sounds/jp_winloop_1.mp3",
    "sounds/jp_winloop_2.mp3"
  ],
  end: [
    "sounds/jp_end_1.mp3",
    "sounds/jp_end_2.mp3"
  ]
};

/* UNIVERSAL PLAYER */
function playFX(file, vol=0.45){
  const a = new Audio(file);
  a.volume = vol;
  a.play();
}

/* RANDOM PICKER */
function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* JACKPOT SEQUENCE */
function triggerJackpotFX(){

  // 1) ANKÜNDIGUNG (wie NOVOLINO)
  playFX(pick(jackpotSounds.announce), 0.55);

  // 2) RISE (Slot‑Machine Spannung)
  setTimeout(()=>{
    playFX(pick(jackpotSounds.rise), 0.45);
  }, 600);

  // 3) EXPLOSION (Gewinn‑Explosion)
  setTimeout(()=>{
    playFX(pick(jackpotSounds.explode), 0.55);
  }, 1400);

  // 4) WIN‑LOOP (Gewinn‑Melodie)
  setTimeout(()=>{
    playFX(pick(jackpotSounds.winloop), 0.40);
  }, 2000);

  // 5) END‑CHIME (Abschluss)
  setTimeout(()=>{
    playFX(pick(jackpotSounds.end), 0.50);
  }, 3500);
}

/* JACKPOT‑TRIGGER IM SPIEL */
function superJackpot(i){
  const axiomSymbols = ["✦","✧","✪","✫","✬","✭"];
  const sym = axiomSymbols[Math.floor(Math.random()*axiomSymbols.length)];

  superPanel.children[i].textContent = "Jackpot: " + sym;

  const hits = Math.floor(Math.random()*10)+1;

  for(let h=0; h<hits; h++){
    const cellIndex = Math.floor(Math.random()*756);
    cells[cellIndex].style.background = "#ffaa00";
    cells[cellIndex].style.transform = "scale(1.2)";
  }

  score += hits * 5;
  updateScore();

  document.getElementById("jackpot-slot").textContent = "Jackpot: " + sym;

  /* ⭐ SOUND‑SEQUENZ STARTEN */
  triggerJackpotFX();
}
</script>


</body>
</html>
