<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>meKI · 756 NC‑Magic Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  body {
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    margin:0;
    overflow:hidden;
  }

  #score {
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    color:#7dd3fc;
    font-size:20px;
    padding:10px;
    z-index:99999;
  }

  #grid {
    position:fixed;
    top:60px; left:0; right:0; bottom:0;
    display:grid;
    grid-template-columns:repeat(27, 1fr);
    grid-template-rows:repeat(28, 1fr);
    gap:3px;
    padding:10px;
  }

  .cell {
    border:1px solid #1f2937;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    transition:transform .4s ease, background .4s ease;
    cursor:pointer;
  }

  #axis-panel {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:#000;
    border-top:2px solid #7dd3fc;
    z-index:99999;
  }

  #super-panel {
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:99999;
  }

  #jackpot-slot {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#ffaa00;
    font-size:26px;
    z-index:99999;
  }

  button {
    background:#0b1220;
    color:#7dd3fc;
    border:1px solid #1f2937;
    padding:10px 14px;
    cursor:pointer;
    border-radius:6px;
    transition:.2s;
  }

  /* FINAL SCREEN */
  #final-screen {
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#000;
    color:#7dd3fc;
    font-family:monospace;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    z-index:999999;
    padding:20px;
    font-size:22px;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>
<div id="axis-panel"></div>
<div id="super-panel"></div>
<div id="jackpot-slot">Jackpot: —</div>

<div id="grid"></div>
<div id="final-screen"></div>

<script>
/* GRID SYMBOLS */
const symbols = [
  "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
  "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
  "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
  "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
];
<!-- LIVE CASINO SOUND ENGINE (NO FILES NEEDED) -->
<script>
/* KOSTENLOSE ONLINE-SOUNDS */
const liveSounds = {
  announce: [
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_0f1e3b.mp3?filename=game-notification-113985.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f3b1f.mp3?filename=arcade-bleep-1-100571.mp3"
  ],
  rise: [
    "https://cdn.pixabay.com/download/audio/2021/08/09/audio_6d1f2a.mp3?filename=slot-machine-6891.mp3",
    "https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c1e3b.mp3?filename=game-level-up-113986.mp3"
  ],
  explode: [
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_3f1b1f.mp3?filename=arcade-explosion-100573.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_2f1b1f.mp3?filename=arcade-bomb-100572.mp3"
  ],
  winloop: [
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_5f1b1f.mp3?filename=arcade-win-100574.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_6f1b1f.mp3?filename=arcade-melody-100575.mp3"
  ],
  end: [
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_7f1b1f.mp3?filename=arcade-end-100576.mp3",
    "https://cdn.pixabay.com/download/audio/2021/09/16/audio_8f1b1f.mp3?filename=arcade-chime-100577.mp3"
  ]
};

/* PLAYER */
function playFX(url, vol=0.45){
  const a = new Audio(url);
  a.volume = vol;
  a.play().catch(()=>{});
}

/* PICK RANDOM */
function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

/* JACKPOT SEQUENCE */
function triggerJackpotFX(){
  playFX(pick(liveSounds.announce), 0.65);     // ANKÜNDIGUNG
  setTimeout(()=> playFX(pick(liveSounds.rise), 0.55), 600);     // RISE
  setTimeout(()=> playFX(pick(liveSounds.explode), 0.65), 1400); // EXPLOSION
  setTimeout(()=> playFX(pick(liveSounds.winloop), 0.45), 2000); // WIN LOOP
  setTimeout(()=> playFX(pick(liveSounds.end), 0.55), 3500);     // END CHIME
}

/* SOUND UNLOCK */
document.body.addEventListener("click", ()=>{
  window.soundUnlocked = true;
}, { once:true });

/* JACKPOT OVERRIDE */
const oldJackpot = superJackpot;
superJackpot = function(i){
  if(!window.soundUnlocked){
    alert("Klick einmal irgendwo, um Sound zu aktivieren!");
  }

  oldJackpot(i);      // Original Jackpot-Funktion
  triggerJackpotFX(); // Sound hinzufügen
};
</script>



</body>
</html>
